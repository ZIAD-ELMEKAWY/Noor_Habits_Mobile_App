name: noor_habits
description: Spiritual habit tracker with smart alarm
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  file_picker: ^8.0.5
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  android_alarm_manager_plus: ^4.0.3
  flutter_ringtone_player: ^4.0.0+3
  vibration: ^1.9.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  hijri: ^3.0.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true
